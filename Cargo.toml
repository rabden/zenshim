[package]
name = "zenshim"
version = "0.5.0"
edition = "2024"
description = "Local OpenAI- and Anthropic-compatible gateway for OpenCode Zen's free tier"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "process", "time", "io-util"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
dialoguer = "0.11"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
